name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mco-simple-python-app-build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build backend and frontend images
        run: docker compose build

      # Fail the build on HIGH or CRITICAL issues that already have a fix.
      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mco-simple-python-app-backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mco-simple-python-app-frontend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
